<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSMEDIA — Tuyển Idol TikTok LIVE & game LIVE tương tác</title>
<meta name="description" content="Tuyển Idol TikTok LIVE: đào tạo từ A–Z, miễn phí cài TikTok LIVE Studio và làm đẹp Douyin. Kèm game tương tác cho phiên LIVE.">
<meta name="theme-color" content="#0b0618">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0618; --bg2: #120a26; --glass: rgba(255, 255, 255, .06); --glass2: rgba(255, 255, 255, .1); --line: rgba(255, 255, 255, .12);
    --tx: #f6f0ff; --mut: #b9a8d9; --vio: #a855f7; --pink: #ec4899; --cy: #22d3ee; --gold: #fcd34d; --ok: #34d399;
    --grad: linear-gradient(120deg, #a855f7, #ec4899 55%, #f97316);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 16px/1.6 'Be Vietnam Pro', system-ui, sans-serif; overflow-x: hidden; }
  a { color: inherit; }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 16px; }
  /* Nền chuyển màu động */
  .bgfx { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bgfx i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
  .bgfx i:nth-child(1) { width: 520px; height: 520px; background: #7c3aed; left: -120px; top: -80px; }
  .bgfx i:nth-child(2) { width: 460px; height: 460px; background: #db2777; right: -140px; top: 20%; animation-delay: -6s; }
  .bgfx i:nth-child(3) { width: 380px; height: 380px; background: #0891b2; left: 30%; bottom: -160px; opacity: .35; animation-delay: -12s; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.15); } }
  .grain { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 3px 3px; opacity: .35; }

  header { position: sticky; top: 0; z-index: 20; background: rgba(11, 6, 24, .55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
  .logo { font-weight: 900; font-size: 22px; letter-spacing: 1px; text-decoration: none; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo::before { content: '◆ '; color: var(--pink); -webkit-text-fill-color: var(--pink); font-size: 16px; }
  nav { margin-left: auto; display: flex; gap: 20px; font-size: 15px; } nav a { text-decoration: none; color: var(--mut); transition: color .2s; } nav a:hover { color: var(--tx); }
  .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 999px; border: 0; font: 800 15px 'Be Vietnam Pro', sans-serif; cursor: pointer; text-decoration: none; overflow: hidden; transition: transform .2s, box-shadow .2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn.pri { background: var(--grad); color: #fff; box-shadow: 0 8px 30px rgba(236, 72, 153, .35); }
  .btn.pri::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); transform: translateX(-120%); animation: shine 3.2s ease-in-out infinite; }
  @keyframes shine { 60%, 100% { transform: translateX(120%); } }
  .btn.ghost { background: var(--glass); color: var(--tx); border: 1px solid var(--line); backdrop-filter: blur(8px); } .btn.ghost:hover { background: var(--glass2); }
  .btn.sm { padding: 9px 15px; font-size: 14px; }
  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 20px; }

  .hero { padding: 56px 0 30px; }
  .hero .wrap { display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; }
  .tag { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(236, 72, 153, .15); border: 1px solid rgba(236, 72, 153, .4); color: #fbcfe8; font-weight: 700; font-size: 13.5px; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(236, 72, 153, .12); } }
  h1 { font-size: clamp(34px, 5.4vw, 60px); line-height: 1.1; margin: 16px 0; font-weight: 900; letter-spacing: -.5px; }
  em.g { font-style: normal; background: var(--grad); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 5s linear infinite; }
  @keyframes flow { to { background-position: 200% center; } }
  .hero p.lead { color: var(--mut); font-size: 18px; max-width: 560px; margin: 0; }
  .cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
  .portrait { position: relative; justify-self: center; width: min(380px, 100%); }
  .portrait .ring { position: absolute; inset: -14px; border-radius: 32px; background: conic-gradient(from 0deg, #a855f7, #ec4899, #22d3ee, #a855f7); animation: spin 8s linear infinite; filter: blur(18px); opacity: .7; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .portrait img { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; border-radius: 28px; border: 1px solid rgba(255,255,255,.25); }
  .chip { position: absolute; padding: 9px 14px; border-radius: 14px; font-weight: 800; font-size: 14px; white-space: nowrap; background: rgba(20, 10, 40, .65); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: float 4s ease-in-out infinite; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .chip:nth-of-type(1) { left: -30px; top: 12%; } .chip:nth-of-type(2) { right: -26px; top: 46%; animation-delay: -1.3s; } .chip:nth-of-type(3) { left: -14px; bottom: 8%; animation-delay: -2.6s; }
  @keyframes float { 50% { transform: translateY(-10px); } }

  section { padding: 56px 0; } section h2 { font-size: clamp(26px, 3.6vw, 36px); margin: 0 0 8px; font-weight: 900; } .sub { color: var(--mut); margin: 0 0 28px; max-width: 720px; }
  .free { position: relative; padding: 30px; display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; overflow: hidden; border-color: rgba(236, 72, 153, .45); }
  .free::before { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(168, 85, 247, .25), rgba(236, 72, 153, .2), rgba(249, 115, 22, .15)); z-index: -1; }
  .free .badge { font-weight: 900; font-size: 22px; padding: 16px 18px; border-radius: 18px; background: var(--grad); text-align: center; line-height: 1.1; transform: rotate(-4deg); box-shadow: 0 10px 30px rgba(236, 72, 153, .4); }
  .free h3 { margin: 0 0 6px; font-size: 24px; font-weight: 900; } .free p { margin: 0; color: #e9ddff; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .perk { padding: 22px; transition: transform .25s, border-color .25s, background .25s; }
  .perk:hover { transform: translateY(-4px); border-color: rgba(236, 72, 153, .5); background: var(--glass2); }
  .perk .ic { font-size: 30px; width: 54px; height: 54px; display: grid; place-items: center; border-radius: 16px; background: rgba(168, 85, 247, .18); margin-bottom: 12px; }
  .perk b { display: block; font-size: 17px; margin-bottom: 4px; } .perk p { margin: 0; color: var(--mut); font-size: 14.5px; }
  .req { padding: 24px; margin-top: 18px; } .req h3 { margin: 0 0 12px; font-size: 20px; }
  .req ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 10px; }
  .req li { padding: 8px 14px; border-radius: 999px; background: rgba(52, 211, 153, .1); border: 1px solid rgba(52, 211, 153, .35); font-size: 14.5px; } .req li::before { content: '✓ '; color: var(--ok); font-weight: 900; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; counter-reset: s; }
  .step { padding: 20px; }
  .step::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--grad); color: #fff; font-weight: 900; margin-bottom: 10px; }
  .step b { display: block; margin-bottom: 4px; } .step p { margin: 0; color: var(--mut); font-size: 14.5px; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; }
  .game { overflow: hidden; display: flex; flex-direction: column; }
  .shots { display: flex; gap: 8px; padding: 12px; background: rgba(0, 0, 0, .25); overflow-x: auto; scrollbar-width: thin; }
  .shots img { height: 230px; border-radius: 12px; flex: none; cursor: zoom-in; transition: transform .2s; } .shots img:hover { transform: scale(1.03); }
  .game .body { padding: 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .game h3 { margin: 0; font-size: 23px; font-weight: 900; } .game .tl { color: var(--mut); margin: 0; font-size: 15px; }
  .game ul { margin: 0; padding-left: 0; list-style: none; font-size: 14.5px; } .game li::before { content: '✓ '; color: var(--ok); font-weight: 800; }
  .price { display: flex; gap: 10px; flex-wrap: wrap; } .price div { background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; font-size: 14px; }
  .price b { color: var(--gold); font-size: 17px; }
  .game .act { display: flex; gap: 10px; margin-top: auto; flex-wrap: wrap; }
  .soon { border-style: dashed; justify-content: center; align-items: center; text-align: center; padding: 30px; color: var(--mut); min-height: 200px; align-self: start; }
  .author { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; padding: 26px; }
  .avatar { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 900; background: var(--grad); overflow: hidden; box-shadow: 0 0 0 4px rgba(255,255,255,.08), 0 10px 30px rgba(168, 85, 247, .4); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .author small { color: var(--pink); font-weight: 800; letter-spacing: .5px; text-transform: uppercase; font-size: 12.5px; }
  .author h3 { margin: 2px 0 6px; font-size: 24px; font-weight: 900; } .author p { margin: 0; color: var(--mut); }
  details { padding: 14px 18px; margin-bottom: 10px; border-radius: 14px; }
  summary { cursor: pointer; font-weight: 700; } details p { color: var(--mut); margin: 8px 0 0; }
  .contact { text-align: center; padding: 40px 20px; }
  footer { border-top: 1px solid var(--line); padding: 26px 0; color: var(--mut); font-size: 14px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  /* Hiện dần khi cuộn */
  .rv { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; } .rv.in { opacity: 1; transform: none; }
  /* Hộp mua */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(5, 2, 12, .75); backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; }
  .modal.on { display: flex; }
  .box { width: 100%; max-width: 560px; background: #160c2c; border: 1px solid var(--line); border-radius: 20px; padding: 22px; position: relative; }
  .box h3 { margin: 0 0 4px; font-size: 22px; } .x { position: absolute; right: 12px; top: 10px; background: none; border: 0; color: var(--mut); font-size: 26px; cursor: pointer; }
  .box label { display: block; font-weight: 700; margin: 16px 0 6px; } .box label small { color: var(--mut); font-weight: 400; }
  .box input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--tx); font: 700 18px monospace; letter-spacing: 2px; text-transform: uppercase; }
  .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .plan { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; background: var(--bg); }
  .plan.on { border-color: var(--pink); box-shadow: 0 0 0 2px rgba(236, 72, 153, .25); } .plan b { display: block; color: var(--gold); font-size: 18px; }
  .qr { text-align: center; background: #fff; border-radius: 14px; padding: 12px; color: #111; margin-top: 8px; } .qr img { width: 100%; max-width: 300px; }
  .qr .ct { font: 700 15px monospace; } .warn { background: rgba(236, 72, 153, .12); border: 1px solid rgba(236, 72, 153, .4); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
  .lb { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .9); display: none; align-items: center; justify-content: center; cursor: zoom-out; } .lb img { max-height: 94vh; max-width: 94vw; border-radius: 12px; } .lb.on { display: flex; }
  .pv { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 70; background: var(--gold); color: #1b1300; font-weight: 800; padding: 8px 16px; border-radius: 999px; font-size: 14px; }
  @media (max-width: 900px) {
    .hero .wrap { grid-template-columns: 1fr; } .portrait { width: min(320px, 80%); margin-top: 10px; }
    .grid3 { grid-template-columns: 1fr 1fr; } .steps { grid-template-columns: 1fr 1fr; } nav { display: none; }
    .free { grid-template-columns: 1fr; text-align: center; } .free .badge { justify-self: center; }
    .author { grid-template-columns: 1fr; text-align: center; } .avatar { justify-self: center; }
  }
  @media (max-width: 520px) {
    .grid3, .steps, .games { grid-template-columns: 1fr; } .shots img { height: 190px; }
    .chip { font-size: 12.5px; padding: 7px 10px; } .chip:nth-of-type(1) { left: -12px; } .chip:nth-of-type(2) { right: -12px; } .chip:nth-of-type(3) { left: -6px; }
    .free { padding: 22px; } header .btn { padding: 8px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .rv { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div><div class="grain"></div>

<header><div class="wrap">
  <a class="logo" href="#" id="logo">BSMEDIA</a>
  <nav><a href="#tuyen-idol" data-t="nav.idol"></a><a href="#quyen-loi" data-t="nav.perks"></a><a href="#games" data-t="nav.games"></a><a href="#hoi-dap" data-t="nav.faq"></a></nav>
  <a class="btn pri sm zalo" target="_blank" href="#lien-he" data-t="nav.cta"></a>
</div></header>

<div class="hero" id="tuyen-idol"><div class="wrap">
  <div class="rv">
    <span class="tag" data-t="hero.tag"></span>
    <h1 data-h="hero.title"></h1>
    <p class="lead" data-t="hero.text"></p>
    <div class="cta"><a class="btn pri zalo" target="_blank" href="#lien-he" data-t="hero.btn1"></a><a class="btn ghost" href="#quyen-loi" data-t="hero.btn2"></a></div>
  </div>
  <div class="portrait rv"><div class="ring"></div><img id="heroImg" alt="Idol TikTok LIVE"><div id="chips"></div></div>
</div></div>

<section style="padding-top:20px"><div class="wrap">
  <div class="free glass rv">
    <div class="badge" data-t="free.badge"></div>
    <div><h3 data-t="free.title"></h3><p data-t="free.text"></p></div>
    <a class="btn pri zalo" target="_blank" href="#lien-he" data-t="free.btn"></a>
  </div>
</div></section>

<section id="quyen-loi"><div class="wrap">
  <h2 class="rv" data-t="perksTitle"></h2><p class="sub rv" data-t="perksSub"></p>
  <div class="grid3" id="perks"></div>
  <div class="req glass rv"><h3 data-t="reqTitle"></h3><ul id="reqs"></ul></div>
</div></section>

<section><div class="wrap">
  <h2 class="rv" data-t="stepsTitle"></h2><p class="sub rv" data-t="stepsSub"></p>
  <div class="steps" id="steps"></div>
</div></section>

<section id="games"><div class="wrap">
  <h2 class="rv" data-t="gamesTitle"></h2><p class="sub rv" data-t="gamesSub"></p>
  <div class="games" id="gameList"></div>
  <h3 class="rv" style="font-size:22px;margin:40px 0 16px" data-t="buyTitle"></h3>
  <div class="steps" id="buySteps"></div>
</div></section>

<section id="tac-gia" style="padding-top:20px"><div class="wrap">
  <div class="author glass rv">
    <div class="avatar" id="avatar"></div>
    <div><small data-t="author.label"></small><h3 data-t="author.name"></h3><p data-t="author.text"></p></div>
    <a class="btn ghost zalo" target="_blank" href="#lien-he">💬 Zalo</a>
  </div>
</div></section>

<section id="hoi-dap"><div class="wrap">
  <h2 class="rv" data-t="faqTitle"></h2>
  <div id="faq"></div>
</div></section>

<section id="lien-he"><div class="wrap">
  <div class="contact glass rv">
    <h2 data-t="contactTitle"></h2><p class="sub" style="margin:0 auto 22px" data-t="contactText"></p>
    <a class="btn pri zalo" target="_blank" href="#" data-t="contactBtn"></a>
    <p id="zaloNum" style="color:var(--mut);margin:14px 0 0;font-size:14px"></p>
  </div>
</div></section>

<footer><div class="wrap"><span>© <span id="year"></span> <span data-t="footer"></span></span><span data-t="footerNote"></span></div></footer>

<div class="modal" id="buy" onclick="if(event.target===this)closeBuy()"><div class="box">
  <button class="x" onclick="closeBuy()" aria-label="Đóng">×</button>
  <h3 id="buyTitle">Mua / gia hạn</h3>
  <p style="color:var(--mut);margin:0">Dán mã máy, chọn gói, quét QR rồi nhắn Zalo để nhận mã.</p>
  <label>1. Mã máy <small>(trong app, ô "Mã máy")</small></label>
  <input id="machine" placeholder="ABCDE-FGH23" maxlength="11" oninput="drawQr()">
  <label>2. Chọn gói</label>
  <div class="plans" id="plans"></div>
  <label>3. Quét QR chuyển khoản</label>
  <div id="qrBox"></div>
  <label>4. Nhắn Zalo để nhận mã</label>
  <p style="margin:0 0 8px;color:var(--mut);font-size:14px">Gửi ảnh chụp chuyển khoản kèm tin nhắn bên dưới:</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost sm" onclick="copyMsg()">📋 Chép tin nhắn</button><a class="btn pri sm zalo" target="_blank" href="#">💬 Mở Zalo</a></div>
  <p id="msgPrev" style="font-size:14px;color:var(--mut)"></p>
</div></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img alt=""></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<em class="g">$1</em>').replace(/\n/g, '<br>');
const money = (n) => n ? `${n.toLocaleString('vi-VN')}đ` : 'Liên hệ';
const get = (o, path) => path.split('.').reduce((a, k) => a?.[k], o);
const params = new URLSearchParams(location.search);
let DATA = { shop: {}, games: [] }, SITE = {}, cur = null, plan = null;

async function getJson(name) { return (await fetch(name, { cache: 'no-cache' })).json(); }
async function load() {
  // ?preview=1: trang admin gửi bản nháp sang để xem trước
  let draft = null;
  if (params.has('preview')) try { draft = JSON.parse(localStorage.getItem('bs-draft') || 'null'); } catch {}
  [SITE, DATA] = draft ? [draft.site, draft.games] : await Promise.all([getJson('site.json'), getJson('games.json')]);
  if (draft) document.body.insertAdjacentHTML('beforeend', '<div class="pv">👁 Bản xem trước — chưa đăng</div>');
  const S = SITE, s = DATA.shop || {};
  document.title = S.seoTitle || S.brand || document.title;
  document.querySelector('meta[name=description]').content = S.seoDescription || '';
  $('logo').textContent = S.brand || '';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = get(S, el.dataset.t) ?? ''; });
  document.querySelectorAll('[data-h]').forEach((el) => { el.innerHTML = rich(get(S, el.dataset.h)); });
  const zalo = s.zalo ? `https://zalo.me/${s.zalo.replace(/\D/g, '')}` : '#lien-he';
  document.querySelectorAll('.zalo').forEach((a) => { a.href = zalo; });
  if (s.zalo) $('zaloNum').textContent = `Zalo: ${s.zalo.replace(/\D/g, '').replace(/(\d{4})(\d{3})(\d+)/, '$1 $2 $3')}`;
  $('year').textContent = new Date().getFullYear();
  const img = (src) => draft?.images?.[src] || src; // ảnh vừa tải lên trong admin
  $('heroImg').src = img(S.hero?.image || 'img/idol.jpg');
  $('chips').innerHTML = (S.hero?.chips || []).map((c) => `<span class="chip">${esc(c)}</span>`).join('');
  $('perks').innerHTML = (S.perks || []).map((p) => `<div class="perk glass rv"><div class="ic">${esc(p.icon)}</div><b>${esc(p.title)}</b><p>${esc(p.text)}</p></div>`).join('');
  $('reqs').innerHTML = (S.requirements || []).map((r) => `<li>${esc(r)}</li>`).join('');
  const steps = (arr) => (arr || []).map((p) => `<div class="step glass rv"><b>${esc(p.title)}</b><p>${esc(p.text)}</p></div>`).join('');
  $('steps').innerHTML = steps(S.steps); $('buySteps').innerHTML = steps(S.buySteps);
  const a = S.author || {};
  $('avatar').innerHTML = a.image ? `<img src="${esc(img(a.image))}" alt="${esc(a.name)}">` : esc((a.name || '?').trim().split(/\s+/).pop()[0]);
  $('faq').innerHTML = (S.faq || []).map((f) => `<details class="glass rv"><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('');
  $('gameList').innerHTML = (DATA.games || []).map((g) => `
    <div class="game glass rv">
      <div class="shots">${(g.images || [g.image]).filter(Boolean).map((src) => `<img src="${esc(img(src))}" alt="${esc(g.name)}" loading="lazy" onclick="zoom(this.src)">`).join('')}</div>
      <div class="body">
        <h3>${esc(g.name)}</h3><p class="tl">${esc(g.tagline)}</p>
        <ul>${(g.features || []).map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
        <div class="price">${(g.plans || []).map((p) => `<div>${esc(p.label)} · <b>${money(p.price)}</b></div>`).join('')}</div>
        <div class="act">
          <a class="btn ghost sm" ${g.download ? `href="${esc(g.download)}"` : 'href="#lien-he"'}>⬇ Tải bản dùng thử${g.version ? ` v${esc(g.version)}` : ''}</a>
          <button class="btn pri sm" onclick="openBuy('${esc(g.id)}')">🛒 Mua / gia hạn</button>
        </div>
      </div>
    </div>`).join('') + '<div class="game glass soon rv">🎮 Game mới đang làm…<br>Nhắn Zalo để được báo khi ra mắt.</div>';
  reveal();
  // Mở từ app (nút "Mua / gia hạn") thì có sẵn game + mã máy
  if (params.get('game')) openBuy(params.get('game'), params.get('may'));
}
function reveal() {
  const els = document.querySelectorAll('.rv:not(.in)');
  if (!('IntersectionObserver' in window)) return els.forEach((e) => e.classList.add('in'));
  const io = new IntersectionObserver((list) => list.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
  els.forEach((e, i) => { e.style.transitionDelay = `${(i % 3) * 80}ms`; io.observe(e); });
}
function zoom(src) { $('lb').querySelector('img').src = src; $('lb').classList.add('on'); }
function openBuy(id, may) {
  cur = DATA.games.find((g) => g.id === id); if (!cur) return;
  plan = cur.plans[0];
  $('buyTitle').textContent = `Mua / gia hạn — ${cur.name}`;
  if (may) $('machine').value = may;
  $('plans').innerHTML = cur.plans.map((p, i) => `<div class="plan ${i ? '' : 'on'}" onclick="pick(${i})"><span>${esc(p.label)}</span><b>${money(p.price)}</b></div>`).join('');
  $('buy').classList.add('on'); drawQr();
}
function closeBuy() { $('buy').classList.remove('on'); }
function pick(i) { plan = cur.plans[i]; [...$('plans').children].forEach((el, j) => el.classList.toggle('on', i === j)); drawQr(); }
const machine = () => $('machine').value.trim().toUpperCase();
const okMachine = () => /^[A-Z2-9]{5}-[A-Z2-9]{5}$/.test(machine());
const content = () => `${cur.id.toUpperCase()} ${machine().replace('-', '')}`;
function drawQr() {
  const s = DATA.shop;
  if (!okMachine()) $('qrBox').innerHTML = '<div class="warn">Nhập mã máy (dạng ABCDE-FGH23) để hiện mã QR.</div>';
  else if (!s.bankBin || !s.bankAccount) $('qrBox').innerHTML = `<div class="warn">Nhắn Zalo để nhận thông tin chuyển khoản. Nội dung chuyển khoản: <b>${esc(content())}</b></div>`;
  else {
    const u = `https://img.vietqr.io/image/${encodeURIComponent(s.bankBin)}-${encodeURIComponent(s.bankAccount)}-compact2.png?amount=${plan.price || ''}&addInfo=${encodeURIComponent(content())}&accountName=${encodeURIComponent(s.accountName || '')}`;
    $('qrBox').innerHTML = `<div class="qr"><img src="${u}" alt="Mã QR chuyển khoản"><div>${esc(s.bankName)} · ${esc(s.bankAccount)} · ${esc(s.accountName)}</div>
      <div>Số tiền: <b>${money(plan.price)}</b></div><div class="ct">Nội dung: ${esc(content())}</div></div>`;
  }
  $('msgPrev').textContent = msg();
}
const msg = () => `Mình đã chuyển khoản mua ${cur?.name} gói ${plan?.label}. Mã máy: ${machine() || '(chưa nhập)'}`;
function copyMsg() { navigator.clipboard.writeText(msg()).then(() => { $('msgPrev').textContent = '✅ Đã chép: ' + msg(); }); }
load();
</script>
</body>
</html>
