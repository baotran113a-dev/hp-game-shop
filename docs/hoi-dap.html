<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Trang chủ","item":"https://tuyendungidol.vn/"},{"@type":"ListItem","position":2,"name":"Hỏi đáp","item":"https://tuyendungidol.vn/hoi-dap"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Chưa từng live có đăng ký làm Idol được không?","acceptedAnswer":{"@type":"Answer","text":"Được. Bạn được đào tạo từ đầu theo lộ trình 7 ngày: cách nói chuyện, giữ chân người xem, kêu gọi quà, chơi PK."}},{"@type":"Question","name":"Miễn phí cài LIVE Studio và làm đẹp Douyin là sao?","acceptedAnswer":{"@type":"Answer","text":"Khi đăng ký làm Idol, kỹ thuật viên cài TikTok LIVE Studio và chỉnh filter làm đẹp kiểu Douyin, ánh sáng, khung hình cho bạn, không mất phí."}},{"@type":"Question","name":"Làm NPC thu nhập thế nào?","acceptedAnswer":{"@type":"Answer","text":"Chính sách NPC tại Buôn Ma Thuột: 10–50 triệu/tháng (lương + chuyên cần + hoa hồng), 130 giờ/tháng, nghỉ 4 ngày, có BHXH. Xem trang Tuyển Idol."}},{"@type":"Question","name":"Có cần LIVE tại studio không?","acceptedAnswer":{"@type":"Answer","text":"Không bắt buộc. Bạn có thể LIVE tại studio ở Buôn Ma Thuột hoặc tại nhà — đội ngũ tư vấn thiết bị và cài đặt cho bạn."}},{"@type":"Question","name":"Game LIVE cần máy cấu hình thế nào?","acceptedAnswer":{"@type":"Answer","text":"Windows 10/11 64-bit, RAM 8GB là chạy được. Máy yếu dùng link sân khấu có thêm ?q=low (hướng dẫn có trong app)."}},{"@type":"Question","name":"Chưa mua game có dùng thử được không?","acceptedAnswer":{"@type":"Answer","text":"Được. Nhắn Zalo shop để nhận file cài, cài xong chơi thử bằng các nút giả lập (có chữ \"BẢN DÙNG THỬ\" trên màn hình). Muốn kết nối phiên LIVE thật thì cần mã kích hoạt."}},{"@type":"Question","name":"Đổi máy tính thì sao?","acceptedAnswer":{"@type":"Answer","text":"Mã kích hoạt gắn với 1 máy. Đổi máy thì nhắn Zalo gửi mã máy mới, mình cấp lại mã cho thời gian còn lại."}},{"@type":"Question","name":"Game có ảnh hưởng tài khoản TikTok không?","acceptedAnswer":{"@type":"Answer","text":"Game chỉ đọc bình luận, tim, quà công khai của phiên live, không cần đăng nhập TikTok. Bạn tự chịu trách nhiệm nội dung phiên live theo quy định của TikTok; app có \"Chế độ an toàn\" để quà chỉ dùng cảm ơn."}},{"@type":"Question","name":"Tài khoản cần xác minh danh tính (KYC) không?","acceptedAnswer":{"@type":"Answer","text":"Nên làm sớm: vào tiktok.com/kyc, chuẩn bị CCCD và làm theo hướng dẫn. Tài khoản chưa xác minh dễ bị giới hạn khi nhận và tặng quà."}},{"@type":"Question","name":"TikTok báo nghi dưới 18 tuổi thì làm gì?","acceptedAnswer":{"@type":"Answer","text":"Chụp rõ, ngang 2 mặt CCCD rồi gửi quản lý để được hướng dẫn bổ sung giấy tờ."}},{"@type":"Question","name":"Bị TikTok cảnh cáo (gậy) thì sao?","acceptedAnswer":{"@type":"Answer","text":"Mỗi lần cảnh cáo có hiệu lực 90 ngày; bị cảnh cáo nhiều lần trong thời gian đó có thể bị hạn chế LIVE hoặc khóa tài khoản vĩnh viễn. Báo quản lý ngay để được hướng dẫn khiếu nại."}},{"@type":"Question","name":"Vì sao tiền rút về ít hơn số thưởng trên app?","acceptedAnswer":{"@type":"Answer","text":"Mỗi lần rút có phí giao dịch, và ngân hàng đổi USD theo tỉ giá riêng (thường thấp hơn trên app). Gom số lớn rồi rút một lần sẽ đỡ phí hơn."}},{"@type":"Question","name":"Rút tiền bị hoàn về hoặc báo giới hạn?","acceptedAnswer":{"@type":"Answer","text":"Thường do ngân hàng đang bảo trì hoặc lỗi liên kết: thử rút lại lúc khác, hoặc hủy liên kết rồi liên kết lại. Vẫn lỗi thì chụp màn hình báo lỗi gửi quản lý."}},{"@type":"Question","name":"LIVE bị giật, văng PK hoặc mất tiếng khi PK?","acceptedAnswer":{"@type":"Answer","text":"Đa phần do TikTok đang cập nhật tính năng (vài ngày) — cập nhật app bản mới nhất và kiểm tra mạng. Mất tiếng khi PK thì tắt hẳn máy khoảng 10 phút rồi vào lại."}}]}]}</script>
